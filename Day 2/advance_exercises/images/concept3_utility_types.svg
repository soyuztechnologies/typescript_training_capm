<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title{font-size:26px;font-weight:700;fill:#1f2328}
    .sub{font-size:15px;fill:#57606a}
    .lbl{font-size:16px;font-weight:700;fill:#1f2328}
    .mono{font-family:Consolas,monospace;font-size:13px;fill:#1f2328}
    .field{font-family:Consolas,monospace;font-size:13.5px;fill:#1f2328}
    .small{font-size:12px;fill:#57606a}
    .util{font-family:Consolas,monospace;font-size:14px;font-weight:700}
    .brand{font-size:12px;fill:#8c959f}
  </style>
  <defs>
    <marker id="au" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="980" height="640" fill="#ffffff"/>
  <text x="40" y="46" class="title">Utility types &#8212; one interface, many derived shapes</text>
  <text x="40" y="72" class="sub">JS analogy: like reshaping one object into create / update / readonly variants &#8212; but here the COMPILER reshapes the TYPE, and you never repeat a field.</text>

  <!-- SOURCE interface -->
  <rect x="40" y="120" width="300" height="430" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2.5"/>
  <text x="190" y="150" class="lbl" text-anchor="middle" fill="#0969da">interface PurchaseOrder</text>
  <text x="190" y="168" class="small" text-anchor="middle">the single source of truth</text>
  <line x1="60" y1="182" x2="320" y2="182" stroke="#0969da" stroke-dasharray="4 3"/>
  <text x="60" y="210" class="field">ID: string</text>
  <text x="200" y="210" class="small" fill="#cf222e">server-set</text>
  <text x="60" y="236" class="field">OrderNo: string</text>
  <text x="60" y="262" class="field">GROSS_AMOUNT: number</text>
  <text x="60" y="288" class="field">CURRENCY: string</text>
  <text x="60" y="314" class="field">OVERALL_STATUS: string</text>
  <text x="60" y="340" class="field">NOTE: string | null</text>
  <line x1="60" y1="356" x2="320" y2="356" stroke="#d0d7de"/>
  <text x="60" y="382" class="field" fill="#8c959f">createdAt: string</text>
  <text x="200" y="382" class="small" fill="#cf222e">server-set</text>
  <text x="60" y="408" class="field" fill="#8c959f">createdBy: string</text>
  <text x="200" y="408" class="small" fill="#cf222e">server-set</text>
  <text x="60" y="434" class="field" fill="#8c959f">modifiedAt: string</text>
  <text x="200" y="434" class="small" fill="#cf222e">server-set</text>
  <text x="60" y="460" class="field" fill="#8c959f">modifiedBy: string</text>
  <text x="200" y="460" class="small" fill="#cf222e">server-set</text>
  <text x="60" y="500" class="small">green = business fields (client sends)</text>
  <text x="60" y="520" class="small">grey = server-managed (client must not send)</text>

  <!-- derived 1: Readonly -->
  <rect x="560" y="120" width="380" height="120" rx="10" fill="#dafbe1" stroke="#1f883d" stroke-width="2"/>
  <text x="576" y="148" class="util" fill="#1f883d">Readonly&lt;PurchaseOrder&gt;</text>
  <text x="576" y="172" class="small">ALL fields kept, every one locked &#128274;</text>
  <text x="576" y="196" class="mono">readonly ID  readonly OrderNo  ...</text>
  <text x="576" y="222" class="small">use for query results you must not mutate</text>

  <!-- derived 2: Omit -->
  <rect x="560" y="262" width="380" height="120" rx="10" fill="#dafbe1" stroke="#1f883d" stroke-width="2"/>
  <text x="576" y="290" class="util" fill="#1f883d">Omit&lt;PurchaseOrder, ServerManaged&gt;</text>
  <text x="576" y="314" class="small">server fields REMOVED &#8594; the CreateOrder payload</text>
  <text x="576" y="338" class="mono">OrderNo  GROSS_AMOUNT  CURRENCY</text>
  <text x="576" y="356" class="mono">OVERALL_STATUS  NOTE</text>
  <text x="576" y="376" class="small">no ID / createdAt / modifiedBy</text>

  <!-- derived 3: Partial + Pick -->
  <rect x="560" y="404" width="380" height="130" rx="10" fill="#dafbe1" stroke="#1f883d" stroke-width="2"/>
  <text x="576" y="432" class="util" fill="#1f883d">Pick&lt;..,'ID'&gt; &amp; Partial&lt;CreateOrder&gt;</text>
  <text x="576" y="456" class="small">ID required, every editable field optional &#8594; UpdateOrder</text>
  <text x="576" y="480" class="mono">ID: string</text>
  <text x="576" y="500" class="mono">OrderNo?  GROSS_AMOUNT?  CURRENCY?</text>
  <text x="576" y="518" class="mono">OVERALL_STATUS?  NOTE?</text>

  <!-- arrows -->
  <line x1="340" y1="240" x2="556" y2="180" stroke="#57606a" stroke-width="2" marker-end="url(#au)"/>
  <line x1="340" y1="320" x2="556" y2="322" stroke="#57606a" stroke-width="2" marker-end="url(#au)"/>
  <line x1="340" y1="410" x2="556" y2="465" stroke="#57606a" stroke-width="2" marker-end="url(#au)"/>

  <!-- pink caution -->
  <rect x="40" y="566" width="900" height="52" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
  <text x="58" y="590" font-size="14" font-weight="700" fill="#cf222e">Watch out:</text>
  <text x="140" y="590" class="small">Omit&lt;T,K&gt; does NOT error on a misspelled key (it accepts any string). Pick&lt;T,K&gt; DOES &#8212; so derive your key set with Pick to catch typos.</text>
  <text x="58" y="610" class="small">Readonly is shallow (top-level only). Build Partial from CreateOrder (not raw PurchaseOrder) so server fields can't leak back in.</text>

  <text x="940" y="636" class="brand" text-anchor="end">code by anubhav trainings</text>
</svg>
