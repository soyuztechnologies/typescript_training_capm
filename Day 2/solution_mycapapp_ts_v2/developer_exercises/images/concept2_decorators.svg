<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .title{font-size:26px;font-weight:700;fill:#1f2328}
    .sub{font-size:15px;fill:#57606a}
    .lbl{font-size:16px;font-weight:700;fill:#1f2328}
    .mono{font-family:Consolas,monospace;font-size:14px;fill:#1f2328}
    .small{font-size:12px;fill:#57606a}
    .step{font-size:13px;fill:#1f2328}
    .num{font-size:13px;font-weight:700;fill:#8250df}
    .brand{font-size:12px;fill:#8c959f}
  </style>
  <defs>
    <marker id="ap" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#8250df"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="40" y="46" class="title">Decorators &#8212; wrap a method without touching its code</text>
  <text x="40" y="72" class="sub">JS analogy: a higher-order function that returns a NEW function around the old one. `@LogRequest` does that, automatically, at class-definition time.</text>

  <!-- caller -->
  <rect x="40" y="280" width="170" height="80" rx="10" fill="#eaeef2" stroke="#57606a" stroke-width="2"/>
  <text x="125" y="312" class="lbl" text-anchor="middle">caller</text>
  <text x="125" y="336" class="mono" text-anchor="middle">handler.boost(id)</text>

  <!-- outer wrapper -->
  <rect x="260" y="120" width="540" height="420" rx="14" fill="#fbf0ff" stroke="#8250df" stroke-width="2.5"/>
  <text x="280" y="150" font-size="17" font-weight="700" fill="#8250df" font-family="Consolas,monospace">@LogRequest  (the replacement function)</text>
  <text x="280" y="172" class="small">same signature in, same signature out &#8212; the caller notices nothing</text>

  <!-- BEFORE steps -->
  <rect x="300" y="190" width="460" height="46" rx="8" fill="#dafbe1" stroke="#1f883d" stroke-width="1.5"/>
  <text x="316" y="210" class="num">1&#46;</text>
  <text x="340" y="210" class="step">log the method name + arguments</text>
  <text x="340" y="228" class="mono">console.log(`&#8594; ${name}(${JSON.stringify(args)})`)</text>

  <rect x="300" y="246" width="460" height="40" rx="8" fill="#dafbe1" stroke="#1f883d" stroke-width="1.5"/>
  <text x="316" y="271" class="num">2&#46;</text>
  <text x="340" y="271" class="mono">const start = performance.now()</text>

  <!-- INNER original method -->
  <rect x="320" y="300" width="420" height="74" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="336" y="324" class="num" fill="#0969da">3&#46;</text>
  <text x="360" y="324" class="lbl" fill="#0969da">your ORIGINAL boost() runs</text>
  <text x="360" y="346" class="mono">originalMethod.apply(this, args)</text>
  <text x="360" y="365" class="small">.apply(this, ...) keeps `this` &#8212; the method still sees its instance</text>

  <!-- AFTER steps -->
  <rect x="300" y="386" width="460" height="46" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="316" y="406" class="num" fill="#9a6700">4&#46;</text>
  <text x="340" y="406" class="step">if it returned a Promise &#8212; wait for it to settle</text>
  <text x="340" y="424" class="mono">result.finally(stopTimer)</text>

  <rect x="300" y="442" width="460" height="40" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="316" y="467" class="num" fill="#9a6700">5&#46;</text>
  <text x="340" y="467" class="mono">log (now - start) ms&#44; then return the result</text>

  <text x="530" y="516" class="small" text-anchor="middle">method body is never edited &#8212; logging + timing are added from the outside</text>

  <!-- arrows -->
  <line x1="210" y1="315" x2="258" y2="315" stroke="#8250df" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="800" y1="320" x2="868" y2="320" stroke="#8250df" stroke-width="2" marker-end="url(#ap)"/>
  <rect x="820" y="280" width="100" height="80" rx="10" fill="#eaeef2" stroke="#57606a" stroke-width="2"/>
  <text x="870" y="308" class="lbl" text-anchor="middle">result</text>
  <text x="870" y="330" class="small" text-anchor="middle">(timed &amp;</text>
  <text x="870" y="346" class="small" text-anchor="middle">logged)</text>

  <!-- pink caution -->
  <rect x="40" y="566" width="880" height="56" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
  <text x="58" y="590" font-size="14" font-weight="700" fill="#cf222e">Two traps:</text>
  <text x="140" y="590" class="small">(a) async methods report ~0ms unless you wait via .finally() &#8212; you timed CREATING the promise, not running it.</text>
  <text x="58" y="610" class="small">(b) Apply it BARE as `@LogRequest` (not `@LogRequest()`) &#8212; the `()` form is only for decorator factories that take options.</text>

  <text x="920" y="636" class="brand" text-anchor="end">code by anubhav trainings</text>
</svg>
