<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#455a64"/>
    </marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#4caf50"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>

  <!-- title -->
  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#263238">SAP BTP CAP + TypeScript — Mashup Design</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#90a4ae">code by anubhav trainings</text>

  <!-- ============ TOP FLOW ============ -->

  <!-- Consumer -->
  <rect x="30" y="110" width="180" height="92" rx="10" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
  <text x="120" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#37474f">API Consumer</text>
  <text x="120" y="164" text-anchor="middle" font-size="12.5" fill="#546e7a">tester.http / OData</text>
  <text x="120" y="183" text-anchor="middle" font-size="12.5" fill="#546e7a">GET &amp; POST</text>

  <!-- CatalogService (orchestrator) -->
  <rect x="320" y="86" width="320" height="184" rx="12" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/>
  <text x="480" y="116" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0d47a1">CatalogService.ts</text>
  <text x="480" y="135" text-anchor="middle" font-size="12" fill="#1565c0">the orchestrator (thin: parse → call → return)</text>
  <line x1="340" y1="146" x2="620" y2="146" stroke="#90caf9" stroke-width="1.5"/>
  <text x="344" y="170" font-size="12.5" fill="#0d47a1">• before CREATE/UPDATE — Material rules</text>
  <text x="344" y="191" font-size="12.5" fill="#0d47a1">• before CREATE — Plant storage rule</text>
  <text x="344" y="212" font-size="12.5" fill="#0d47a1">• on getSalesOrders  (GET + item lines)</text>
  <text x="344" y="233" font-size="12.5" fill="#0d47a1">• on createSalesOrder (POST + item lines)</text>
  <text x="344" y="256" font-size="12.5" fill="#1565c0">imports BigNumber for item quantities</text>

  <!-- Generated client -->
  <rect x="720" y="92" width="250" height="78" rx="10" fill="#ede7f6" stroke="#673ab7" stroke-width="2"/>
  <text x="845" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4527a0">Generated client</text>
  <text x="845" y="143" text-anchor="middle" font-size="11.5" fill="#5e35b1">sap-s4-OP_SALESORDER_0001-v1</text>
  <text x="845" y="160" text-anchor="middle" font-size="11.5" fill="#5e35b1">request &amp; entity builders (typed)</text>

  <!-- S/4HANA -->
  <rect x="720" y="206" width="250" height="84" rx="10" fill="#fce4ec" stroke="#e91e63" stroke-width="2"/>
  <text x="845" y="238" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ad1457">S/4HANA Sales Order</text>
  <text x="845" y="259" text-anchor="middle" font-size="12" fill="#c2185b">remote OData V4 service</text>
  <text x="845" y="277" text-anchor="middle" font-size="11.5" fill="#c2185b">122.162.240.164:8010</text>

  <!-- Local DB -->
  <rect x="30" y="300" width="200" height="120" rx="10" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
  <text x="130" y="330" text-anchor="middle" font-size="14.5" font-weight="700" fill="#f57f17">Local DB</text>
  <text x="130" y="352" text-anchor="middle" font-size="12.5" fill="#8d6e00">Material  →  Plant</text>
  <text x="130" y="373" text-anchor="middle" font-size="11.5" fill="#8d6e00">cuid keys + association</text>
  <text x="130" y="394" text-anchor="middle" font-size="11.5" fill="#8d6e00">seed: 10 plants / 20 mats</text>
  <text x="130" y="412" text-anchor="middle" font-size="11" fill="#a1887f">types via cds-typer (#cds-models)</text>

  <!-- ============ SUPPORTING FILES ============ -->
  <rect x="270" y="470" width="216" height="128" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="378" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">config-loader.ts</text>
  <text x="378" y="522" text-anchor="middle" font-size="11.5" fill="#388e3c">host + creds from .env</text>
  <text x="378" y="540" text-anchor="middle" font-size="11.5" fill="#388e3c">+ service path (in code)</text>
  <text x="378" y="558" text-anchor="middle" font-size="11.5" fill="#388e3c">V2 / V4 type guards</text>
  <text x="378" y="582" text-anchor="middle" font-size="11" fill="#66bb6a">"where &amp; how we connect"</text>

  <rect x="510" y="470" width="216" height="128" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="618" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">payload-parser.ts</text>
  <text x="618" y="522" text-anchor="middle" font-size="11.5" fill="#388e3c">validates unknown JSON</text>
  <text x="618" y="540" text-anchor="middle" font-size="11.5" fill="#388e3c">→ typed SalesOrderInput</text>
  <text x="618" y="558" text-anchor="middle" font-size="11.5" fill="#388e3c">rejects bad input</text>
  <text x="618" y="582" text-anchor="middle" font-size="11" fill="#66bb6a">"the bouncer"</text>

  <rect x="750" y="470" width="216" height="128" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="858" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#e65100">sales-order.d.ts</text>
  <text x="858" y="522" text-anchor="middle" font-size="11.5" fill="#ef6c00">Input + Item / View + Item</text>
  <text x="858" y="540" text-anchor="middle" font-size="11.5" fill="#ef6c00">(header rows carry items[])</text>
  <text x="858" y="558" text-anchor="middle" font-size="11.5" fill="#ef6c00">S4Config, ODataVersion</text>
  <text x="858" y="582" text-anchor="middle" font-size="11" fill="#ffa726">"shared vocabulary"</text>

  <!-- ============ ARROWS (solid = data flow) ============ -->
  <!-- consumer -> service -->
  <line x1="210" y1="156" x2="316" y2="172" stroke="#455a64" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="258" y="150" text-anchor="middle" font-size="11" fill="#455a64">/odata/v4/catalog</text>

  <!-- service -> generated client -->
  <line x1="640" y1="140" x2="716" y2="131" stroke="#455a64" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="678" y="120" text-anchor="middle" font-size="11" fill="#455a64">typed calls</text>

  <!-- generated client -> s/4 -->
  <line x1="845" y1="170" x2="845" y2="202" stroke="#455a64" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="940" y="190" text-anchor="middle" font-size="11" fill="#455a64">HTTP</text>

  <!-- service <-> local db -->
  <line x1="324" y1="234" x2="206" y2="312" stroke="#455a64" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="232" y="270" text-anchor="middle" font-size="11" fill="#455a64">SELECT</text>

  <!-- ============ ARROWS (dashed = uses / depends on) ============ -->
  <line x1="378" y1="470" x2="430" y2="272" stroke="#4caf50" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDashed)"/>
  <line x1="618" y1="470" x2="540" y2="272" stroke="#4caf50" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDashed)"/>
  <line x1="858" y1="470" x2="612" y2="272" stroke="#4caf50" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDashed)"/>

  <!-- ============ LEGEND ============ -->
  <line x1="40" y1="556" x2="80" y2="556" stroke="#455a64" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="88" y="560" font-size="12" fill="#455a64">data flow (request / call)</text>
  <line x1="40" y1="582" x2="80" y2="582" stroke="#4caf50" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDashed)"/>
  <text x="88" y="586" font-size="12" fill="#455a64">uses / depends on</text>
</svg>
