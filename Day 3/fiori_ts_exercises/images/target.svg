<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#455a64"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>

  <!-- title -->
  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1b5e20">manageorder — Target Structure (TypeScript)</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#90a4ae">code by anubhav trainings</text>

  <!-- Tooling row -->
  <rect x="30" y="92" width="940" height="96" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2.5"/>
  <text x="50" y="120" font-size="15" font-weight="700" fill="#1b5e20">Build / Serve Tooling (transpiler ON)</text>
  <text x="50" y="144" font-size="12.5" fill="#2e7d32">ui5.yaml  — server middleware + build task: ui5-tooling-transpile (Babel + @ui5/ts-interface)</text>
  <text x="50" y="162" font-size="12.5" fill="#2e7d32">package.json — devDeps: typescript, ui5-tooling-transpile, @openui5/ts-types-esm, @ui5/cli, livereload</text>
  <text x="50" y="180" font-size="12.5" fill="#2e7d32">tsconfig.json — target ES2022, bundler, noImplicitOverride, types: @openui5/ts-types-esm</text>

  <!-- Component -->
  <rect x="370" y="214" width="240" height="62" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/>
  <text x="490" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">Component.ts</text>
  <text x="490" y="261" text-anchor="middle" font-size="11" fill="#1565c0">class extends UIComponent</text>

  <!-- manifest -->
  <rect x="670" y="214" width="300" height="62" rx="10" fill="#ede7f6" stroke="#673ab7" stroke-width="2"/>
  <text x="820" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#4527a0">manifest.json (unchanged)</text>
  <text x="820" y="261" text-anchor="middle" font-size="11" fill="#5e35b1">same routes / targets</text>

  <!-- Controllers box -->
  <rect x="30" y="296" width="470" height="340" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2.5"/>
  <text x="265" y="324" text-anchor="middle" font-size="16" font-weight="700" fill="#1b5e20">webapp/controller/  (7 files — all .ts)</text>

  <rect x="55" y="342" width="200" height="46" rx="8" fill="#ffffff" stroke="#81c784"/>
  <text x="155" y="363" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e7d32">BaseController.ts</text>
  <text x="155" y="379" text-anchor="middle" font-size="10.5" fill="#388e3c">class + formatter</text>

  <rect x="275" y="342" width="200" height="46" rx="8" fill="#ffffff" stroke="#81c784"/>
  <text x="375" y="363" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e7d32">App.controller.ts</text>
  <text x="375" y="379" text-anchor="middle" font-size="10.5" fill="#388e3c">class</text>

  <rect x="55" y="400" width="200" height="46" rx="8" fill="#ffffff" stroke="#81c784"/>
  <text x="155" y="421" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e7d32">View1.controller.ts</text>
  <text x="155" y="437" text-anchor="middle" font-size="10.5" fill="#388e3c">typed onSearch/event</text>

  <rect x="275" y="400" width="200" height="46" rx="8" fill="#ffffff" stroke="#81c784"/>
  <text x="375" y="421" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e7d32">View2.controller.ts</text>
  <text x="375" y="437" text-anchor="middle" font-size="10.5" fill="#388e3c">typed fragments</text>

  <rect x="55" y="458" width="200" height="46" rx="8" fill="#ffffff" stroke="#81c784"/>
  <text x="155" y="479" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e7d32">View3.controller.ts</text>
  <text x="155" y="495" text-anchor="middle" font-size="10.5" fill="#388e3c">typed nav</text>

  <rect x="275" y="458" width="200" height="46" rx="8" fill="#ffffff" stroke="#81c784"/>
  <text x="375" y="479" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e7d32">Add.controller.ts</text>
  <text x="375" y="495" text-anchor="middle" font-size="10.5" fill="#388e3c">typed POST callback</text>

  <rect x="165" y="516" width="200" height="46" rx="8" fill="#ffffff" stroke="#81c784"/>
  <text x="265" y="537" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e7d32">Empty.controller.ts</text>
  <text x="265" y="553" text-anchor="middle" font-size="10.5" fill="#388e3c">class</text>

  <text x="265" y="592" text-anchor="middle" font-size="11.5" font-style="italic" fill="#558b2f">every file = export default class X extends Base { ... }</text>
  <text x="265" y="614" text-anchor="middle" font-size="11.5" font-style="italic" fill="#558b2f">@ui5/eslint + ESM imports replace sap.ui.define</text>

  <!-- Types box (NEW) -->
  <rect x="530" y="296" width="440" height="120" rx="12" fill="#e0f7fa" stroke="#00acc1" stroke-width="2.5"/>
  <text x="750" y="324" text-anchor="middle" font-size="16" font-weight="700" fill="#006064">NEW — Shared Types</text>
  <rect x="555" y="340" width="390" height="58" rx="8" fill="#ffffff" stroke="#4dd0e1"/>
  <text x="750" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#00838f">webapp/types/datatype.d.ts</text>
  <text x="750" y="384" text-anchor="middle" font-size="10.5" fill="#0097a7">SalesOrder, SalesOrderItem, City, Supplier interfaces</text>

  <!-- Helpers box -->
  <rect x="530" y="430" width="440" height="120" rx="12" fill="#fffde7" stroke="#fbc02d" stroke-width="2.5"/>
  <text x="750" y="458" text-anchor="middle" font-size="16" font-weight="700" fill="#f57f17">Helpers (.ts)</text>
  <rect x="555" y="474" width="180" height="60" rx="8" fill="#ffffff" stroke="#ffd54f"/>
  <text x="645" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#f9a825">util/formatter.ts</text>
  <text x="645" y="520" text-anchor="middle" font-size="10.5" fill="#f9a825">typed return strings</text>
  <rect x="760" y="474" width="180" height="60" rx="8" fill="#ffffff" stroke="#ffd54f"/>
  <text x="850" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#f9a825">model/models.ts</text>
  <text x="850" y="520" text-anchor="middle" font-size="10.5" fill="#f9a825">typed JSONModel</text>

  <!-- App Router box (NEW) -->
  <rect x="530" y="564" width="440" height="72" rx="12" fill="#ffebee" stroke="#e53935" stroke-width="2.5"/>
  <text x="750" y="590" text-anchor="middle" font-size="15" font-weight="700" fill="#b71c1c">NEW — Deployment (Step 4)</text>
  <text x="750" y="612" text-anchor="middle" font-size="11.5" fill="#c62828">xs-app.json (App Router routes)  ·  mta.yaml (approuter + html5 modules)</text>

  <!-- Views note -->
  <rect x="30" y="652" width="940" height="42" rx="8" fill="#fce4ec" stroke="#e91e63"/>
  <text x="500" y="678" text-anchor="middle" font-size="12.5" fill="#ad1457">Views &amp; Fragments (XML) and i18n stay exactly the same — only the controller behind each view changes from .js to .ts</text>

  <!-- arrows -->
  <line x1="490" y1="276" x2="430" y2="296" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- footer banner -->
  <rect x="30" y="704" width="940" height="44" rx="8" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="500" y="732" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b5e20">Target: 100% TypeScript · strict type-checking · transpiled to JS on serve/build · ready for BTP App Router</text>
</svg>
