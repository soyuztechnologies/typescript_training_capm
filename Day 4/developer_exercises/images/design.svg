<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif">
  <!-- ============ Background ============ -->
  <rect x="0" y="0" width="1200" height="760" fill="#f6f8fa"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0b3d2e"/>
  <text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">
    CI/CD Pipeline · GitHub Actions  →  SAP BTP Cloud Foundry
  </text>

  <!-- ============ Lane labels ============ -->
  <text x="30" y="110" font-size="15" font-weight="700" fill="#57606a">DEVELOPER</text>
  <text x="30" y="250" font-size="15" font-weight="700" fill="#57606a">GITHUB</text>
  <text x="30" y="430" font-size="15" font-weight="700" fill="#57606a">CI: QUALITY GATES</text>
  <text x="30" y="640" font-size="15" font-weight="700" fill="#57606a">CD: DEPLOY</text>

  <!-- Lane separators -->
  <line x1="20" y1="125" x2="1180" y2="125" stroke="#d0d7de" stroke-width="1"/>
  <line x1="20" y1="300" x2="1180" y2="300" stroke="#d0d7de" stroke-width="1"/>
  <line x1="20" y1="490" x2="1180" y2="490" stroke="#d0d7de" stroke-width="1"/>

  <!-- ============ DEVELOPER LANE ============ -->
  <g>
    <rect x="80" y="150" width="220" height="90" rx="10" fill="#ffffff" stroke="#2da44e" stroke-width="2"/>
    <text x="190" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Write Code</text>
    <text x="190" y="207" text-anchor="middle" font-size="12" fill="#57606a">CAP + Fiori TypeScript</text>
    <text x="190" y="225" text-anchor="middle" font-size="12" fill="#57606a">git commit</text>
  </g>
  <g>
    <rect x="360" y="150" width="220" height="90" rx="10" fill="#ffffff" stroke="#2da44e" stroke-width="2"/>
    <text x="470" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">git push</text>
    <text x="470" y="207" text-anchor="middle" font-size="12" fill="#57606a">feature branch</text>
    <text x="470" y="225" text-anchor="middle" font-size="12" fill="#57606a">or open Pull Request</text>
  </g>

  <!-- ============ GITHUB LANE ============ -->
  <g>
    <rect x="640" y="150" width="240" height="90" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
    <text x="760" y="183" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Trigger Workflow</text>
    <text x="760" y="207" text-anchor="middle" font-size="12" fill="#57606a">.github/workflows/deploy.yml</text>
    <text x="760" y="225" text-anchor="middle" font-size="12" fill="#57606a">on: push / pull_request</text>
  </g>
  <g>
    <rect x="940" y="150" width="200" height="90" rx="10" fill="#fff8e6" stroke="#bf8700" stroke-width="2"/>
    <text x="1040" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Secrets</text>
    <text x="1040" y="200" text-anchor="middle" font-size="11" fill="#57606a">CF_API / CF_ORG</text>
    <text x="1040" y="216" text-anchor="middle" font-size="11" fill="#57606a">CF_USERNAME</text>
    <text x="1040" y="232" text-anchor="middle" font-size="11" fill="#57606a">CF_PASSWORD</text>
  </g>

  <!-- ============ CI LANE : QUALITY GATES ============ -->
  <g>
    <rect x="80" y="335" width="230" height="110" rx="10" fill="#e6ffed" stroke="#1a7f37" stroke-width="2"/>
    <text x="195" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#0b3d2e">GATE 1 · Type Check</text>
    <text x="195" y="390" text-anchor="middle" font-size="13" fill="#1a1a1a" font-family="Consolas, monospace">tsc --noEmit</text>
    <text x="195" y="414" text-anchor="middle" font-size="11" fill="#57606a">Fails build on any</text>
    <text x="195" y="430" text-anchor="middle" font-size="11" fill="#57606a">TypeScript type error</text>
  </g>
  <g>
    <rect x="360" y="335" width="230" height="110" rx="10" fill="#e6ffed" stroke="#1a7f37" stroke-width="2"/>
    <text x="475" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#0b3d2e">GATE 2 · Unit Tests</text>
    <text x="475" y="390" text-anchor="middle" font-size="13" fill="#1a1a1a" font-family="Consolas, monospace">jest (ts-jest)</text>
    <text x="475" y="414" text-anchor="middle" font-size="11" fill="#57606a">Order-data tests on</text>
    <text x="475" y="430" text-anchor="middle" font-size="11" fill="#57606a">parseSalesOrder()</text>
  </g>
  <g>
    <rect x="640" y="335" width="230" height="110" rx="10" fill="#e6ffed" stroke="#1a7f37" stroke-width="2"/>
    <text x="755" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#0b3d2e">GATE 3 · Compile</text>
    <text x="755" y="390" text-anchor="middle" font-size="13" fill="#1a1a1a" font-family="Consolas, monospace">tsc  →  dist/</text>
    <text x="755" y="414" text-anchor="middle" font-size="11" fill="#57606a">Produces JS output +</text>
    <text x="755" y="430" text-anchor="middle" font-size="11" fill="#57606a">uploads build artifact</text>
  </g>
  <g>
    <rect x="940" y="335" width="200" height="110" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="1040" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Artifact</text>
    <text x="1040" y="398" text-anchor="middle" font-size="12" fill="#57606a">upload dist/</text>
    <text x="1040" y="418" text-anchor="middle" font-size="12" fill="#57606a">shared between</text>
    <text x="1040" y="434" text-anchor="middle" font-size="12" fill="#57606a">jobs</text>
  </g>

  <!-- ============ CD LANE : DEPLOY ============ -->
  <g>
    <rect x="80" y="535" width="250" height="120" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="205" y="568" text-anchor="middle" font-size="16" font-weight="700" fill="#0a3069">Build MTA</text>
    <text x="205" y="595" text-anchor="middle" font-size="12" fill="#1a1a1a" font-family="Consolas, monospace">mbt build</text>
    <text x="205" y="618" text-anchor="middle" font-size="11" fill="#57606a">cds build --production</text>
    <text x="205" y="636" text-anchor="middle" font-size="11" fill="#57606a">→ *.mtar archive</text>
  </g>
  <g>
    <rect x="390" y="535" width="250" height="120" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="515" y="568" text-anchor="middle" font-size="16" font-weight="700" fill="#0a3069">Login to CF</text>
    <text x="515" y="595" text-anchor="middle" font-size="12" fill="#1a1a1a" font-family="Consolas, monospace">cf api / cf auth</text>
    <text x="515" y="618" text-anchor="middle" font-size="11" fill="#57606a">cf target -o ORG -s SPACE</text>
    <text x="515" y="636" text-anchor="middle" font-size="11" fill="#57606a">uses GitHub Secrets</text>
  </g>
  <g>
    <rect x="700" y="535" width="250" height="120" rx="10" fill="#0969da" stroke="#0a3069" stroke-width="2"/>
    <text x="825" y="568" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Deploy</text>
    <text x="825" y="595" text-anchor="middle" font-size="12" fill="#ffffff" font-family="Consolas, monospace">cf deploy *.mtar</text>
    <text x="825" y="618" text-anchor="middle" font-size="11" fill="#cfe6ff">srv + Fiori UI + approuter</text>
    <text x="825" y="636" text-anchor="middle" font-size="11" fill="#cfe6ff">to BTP Cloud Foundry</text>
  </g>
  <g>
    <rect x="1010" y="535" width="150" height="120" rx="10" fill="#e6ffed" stroke="#1a7f37" stroke-width="2"/>
    <text x="1085" y="585" text-anchor="middle" font-size="15" font-weight="700" fill="#0b3d2e">Live App</text>
    <text x="1085" y="612" text-anchor="middle" font-size="22">🚀</text>
    <text x="1085" y="640" text-anchor="middle" font-size="11" fill="#57606a">running on BTP</text>
  </g>

  <!-- ============ Arrows ============ -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57606a"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#cf222e"/>
    </marker>
  </defs>

  <!-- dev flow -->
  <line x1="300" y1="195" x2="355" y2="195" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="195" x2="635" y2="195" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="195" x2="935" y2="195" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- github -> CI gate 1 (down + left) -->
  <line x1="760" y1="240" x2="760" y2="270" stroke="#57606a" stroke-width="2"/>
  <line x1="760" y1="270" x2="195" y2="270" stroke="#57606a" stroke-width="2"/>
  <line x1="195" y1="270" x2="195" y2="333" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- gate 1 -> 2 -> 3 -> artifact -->
  <line x1="310" y1="390" x2="358" y2="390" stroke="#1a7f37" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="390" x2="638" y2="390" stroke="#1a7f37" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870" y1="390" x2="938" y2="390" stroke="#1a7f37" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CI -> CD (down from gate3 area to build mta) -->
  <line x1="755" y1="445" x2="755" y2="510" stroke="#57606a" stroke-width="2"/>
  <line x1="755" y1="510" x2="205" y2="510" stroke="#57606a" stroke-width="2"/>
  <line x1="205" y1="510" x2="205" y2="533" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CD flow -->
  <line x1="330" y1="595" x2="388" y2="595" stroke="#0969da" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="595" x2="698" y2="595" stroke="#0969da" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="950" y1="595" x2="1008" y2="595" stroke="#0969da" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- FAIL feedback loop from gates back to developer -->
  <path d="M195,335 C195,300 40,300 40,180 C40,150 75,170 78,180" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowred)"/>
  <text x="55" y="295" font-size="11" font-weight="700" fill="#cf222e" transform="rotate(-90 55 295)">❌ FAIL → fix &amp; re-push</text>

  <!-- footer -->
  <text x="600" y="730" text-anchor="middle" font-size="13" fill="#57606a">
    Type errors and failing tests STOP the pipeline before deployment — only green builds reach Cloud Foundry.
  </text>
  <text x="1180" y="752" text-anchor="end" font-size="11" font-style="italic" fill="#8c959f">code by anubhav trainings</text>
</svg>
